<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="화면 중앙에 '내 첫 번째 아이디어'를 담은 감각적이고 몰입감 있는 인터랙티브 웹페이지입니다." />
  <meta name="theme-color" content="#040814" />
  <title>내 첫 번째 아이디어 | My First Idea</title>

  <!-- Pretendard & Outfit Typography -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Ambient Dynamic Canvas Background -->
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <!-- Background Decorative Blue Luminous Orbs -->
  <div class="ambient-glow orb-sapphire" aria-hidden="true"></div>
  <div class="ambient-glow orb-cyan" aria-hidden="true"></div>
  <div class="ambient-glow orb-cobalt" aria-hidden="true"></div>

  <!-- Main Center Experience -->
  <main class="viewport-wrapper" id="main-content">
    <div class="card-container" id="card-wrapper">
      <div class="idea-glass-card" id="idea-card">
        <!-- Top Badge -->
        <div class="badge-wrapper">
          <span class="sparkle-badge" id="category-badge">
            <span class="sparkle-icon" aria-hidden="true">✨</span>
            <span class="badge-text">푸른 영감의 시작</span>
          </span>
        </div>

        <!-- Main Focal Typography -->
        <header class="card-header">
          <h1 id="main-sentence" class="hero-title">
            <span class="title-shimmer">내 첫 번째 아이디어</span>
          </h1>
          <p id="sub-sentence" class="hero-subtitle">
            모든 위대한 혁신은 마음속에 피어난 하나의 작은 생각에서 시작됩니다.
          </p>
        </header>

        <!-- Interactive Quote / Inspiration Prompt -->
        <div class="inspiration-box" id="inspiration-display">
          <span class="quote-mark">“</span>
          <span id="inspiration-text">세상을 바꿀 가능성이 이 순간 시작되었습니다.</span>
          <span class="quote-mark">”</span>
        </div>

        <!-- Action Controls -->
        <div class="action-buttons-group">
          <button id="btn-sparkle" class="primary-btn" title="영감의 빛 뿌리기">
            <span class="btn-icon">💫</span>
            <span class="btn-label">영감의 불꽃 띄우기</span>
          </button>
          
          <button id="btn-memo-toggle" class="secondary-btn" title="나만의 아이디어 기록하기">
            <span class="btn-icon">💡</span>
            <span class="btn-label">생각 기록하기</span>
          </button>

          <button id="btn-copy" class="icon-btn" title="문장 복사하기" aria-label="문장 복사하기">
            <svg class="copy-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>

        <!-- Interactive Idea Note Section (Collapsible) -->
        <section id="idea-drawer" class="idea-drawer hidden" aria-labelledby="drawer-heading">
          <h2 id="drawer-heading" class="sr-only">내 첫 번째 아이디어 기록함</h2>
          <div class="drawer-inner">
            <label for="user-idea-input" class="drawer-label">떠오른 영감을 자유롭게 적어보세요</label>
            <div class="input-with-button">
              <textarea id="user-idea-input" rows="3" placeholder="예: 매일 아침 사람들에게 기분 좋은 영감을 주는 작은 앱을 만들어보고 싶다..." maxlength="300"></textarea>
            </div>
            <div class="drawer-actions">
              <span id="char-counter" class="char-counter">0 / 300</span>
              <button id="btn-save-idea" class="save-btn">저장하기</button>
            </div>
            <div id="saved-ideas-container" class="saved-ideas-container">
              <!-- Dynamically populated saved notes -->
            </div>
          </div>
        </section>

        <!-- Card Footer -->
        <footer class="card-footer">
          <span class="status-indicator">
            <span class="pulse-dot"></span>
            영감 실시간 연결됨
          </span>
          <span class="hint-text">카드를 마우스로 움직여보세요</span>
        </footer>
      </div>
    </div>
  </main>

  <!-- Interactive Floating Particles Container -->
  <div id="particles-overlay" aria-hidden="true"></div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
